spring:
  application:
    name: nexus-platform
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/nexus}
    username: ${DB_USER:nexus}
    password: ${DB_PASSWORD:nexus}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  error:
    include-message: always
