spring:
  application:
    name: enterprise-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/enterprise}
    username: ${DB_USER:enterprise}
    password: ${DB_PASSWORD:enterprise}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized

server:
  error:
    include-message: always

springdoc:
  swagger-ui:
    path: /swagger-ui.html
