name: Enterprise API CI

on:
  push:
    paths:
      - 'projects/enterprise-api/**'
      - '.github/workflows/enterprise-api-ci.yml'
  pull_request:
    paths:
      - 'projects/enterprise-api/**'
      - '.github/workflows/enterprise-api-ci.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/enterprise-api

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run tests
        run: mvn --batch-mode test
